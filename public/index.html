<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Torrent Downloader</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header>
      <h1>⚡ Torrent Downloader</h1>
      <p class="subtitle">Local high-speed download manager</p>
    </header>

    <section class="add-panel">
      <div class="tabs">
        <button class="tab-btn active" data-tab="magnet">Magnet Link</button>
        <button class="tab-btn" data-tab="file">.torrent File</button>
      </div>

      <div class="tab-content active" id="tab-magnet">
        <form id="magnetForm">
          <input type="text" id="magnetInput" placeholder="magnet:?xt=urn:btih:..." required />
          <button type="submit">Add</button>
        </form>
      </div>

      <div class="tab-content" id="tab-file">
        <form id="fileForm">
          <input type="file" id="fileInput" accept=".torrent" required />
          <button type="submit">Add</button>
        </form>
      </div>
      <div id="statusMsg"></div>
    </section>

    <section class="torrents">
      <h2>Downloads</h2>
      <div id="torrentList" class="torrent-list">
        <p class="empty">No downloads yet. Add a magnet link or .torrent file above.</p>
      </div>
    </section>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
