version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: torrent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: torrent_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    # Internal only — NOT exposed publicly to the Internet
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d torrent_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: torrent-redis
    restart: unless-stopped
    # Internal only — NOT exposed publicly to the Internet
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  transmission:
    image: lscr.io/linuxserver/transmission:latest
    container_name: torrent-transmission
    restart: unless-stopped
    environment:
      PUID: 1000
      PGID: 1000
      TZ: UTC
      TRANSMISSION_DOWNLOAD_DIR: /downloads
      TRANSMISSION_INCOMPLETE_DIR: /incomplete
      PEERPORT: ${TRANSMISSION_PEER_PORT:-51413}
    volumes:
      - ./data/transmission/downloads:/downloads
      - ./data/transmission/incomplete:/incomplete
      - ./data/transmission/config:/config
    # Only peer ports are exposed publicly; RPC port 9091 is internal only
    expose:
      - "9091"
    ports:
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/tcp"
      - "${TRANSMISSION_PEER_PORT:-51413}:${TRANSMISSION_PEER_PORT:-51413}/udp"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: torrent-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      # Internal API communication
      NEXT_PUBLIC_API_URL: ""
    # Internal only — served publicly via the Port 80 Node Gateway
    expose:
      - "3000"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: torrent-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Direct Port 80 Node Gateway
      PORT: 80
      WEB_URL: http://web:3000
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgrespassword}@postgres:5432/torrent_db?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      TRANSMISSION_HOST: transmission
      TRANSMISSION_RPC_PORT: 9091
      TRANSMISSION_PEER_PORT: ${TRANSMISSION_PEER_PORT:-51413}
      # AWS S3 Storage (Default Credential Provider Chain uses EC2 IAM Role)
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-my-torrent-bucket}
      S3_PREFIX: ${S3_PREFIX:-users/}
      AWS_S3_STORAGE_CLASS: ${AWS_S3_STORAGE_CLASS:-INTELLIGENT_TIERING}
      DOWNLOAD_DIR: /downloads
      INCOMPLETE_DIR: /incomplete
    # Publicly exposed on Port 80
    ports:
      - "${PORT:-80}:80"
    volumes:
      - ./data/transmission/downloads:/downloads
      - ./data/transmission/incomplete:/incomplete
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      web:
        condition: service_started

volumes:
  postgres_data:
  redis_data:
